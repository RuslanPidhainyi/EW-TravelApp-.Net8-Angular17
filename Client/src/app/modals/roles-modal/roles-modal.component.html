<div class="modal-header">
    <h2 class="modal-title h4 pull-left" id="roles-modal-title">Edit roles for {{title}}</h2>
    <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="bsModalRef.hide()">
        <span aria-hidden="true" class="visually-hidden">&times;</span>
    </button>
</div>
<div class="modal-body">

    @for (role of availableRoles; track $index) {
        <div class="form-check">
            <input 
                type="checkbox"
                [id]="'role-' + role"
                class="form-check-input"
                [checked]="selectedRoles.includes(role)"
                value="role"
                (change)="updateChecked(role)"
                [disabled]="role === 'Admin' && username === 'admin'"
            >
            <label [attr.for]="'role-' + role">{{role}}</label>
        </div>
    }

</div>
<div class="modal-footer">
    <button [disabled]="selectedRoles.length === 0" type="button" class="btn btn-success"
        (click)="onSelectRoles()">Submit</button>
</div>
