<div class="offer-container" data-testid="offer-card">
    <div class="photo-container">
        <img src="{{postE().url}}" alt="{{postE().title}}" routerLink="/offers/{{postE().id}}" data-testid="offer-card-photo">
        <div class="location-overlay" data-testid="offer-card-location">
            <p><i class="fa fa-map-marker me-1"></i> {{postE().locationCountry}}, {{postE().locationCity}}</p>
        </div>
    </div>
    <div class="info">
        <div class="info-row-1-left">
            <div class="title-info">
                <h6 data-testid="offer-card-title">{{postE().title}}</h6>
            </div>
            <div class="icon-buttons">
                <i data-testid="offer-card-edit" class="fa fa-pencil-square-o" routerLink="/edit-offer/{{postE().id}}"></i>
                <i data-testid="offer-card-delete" class="fa fa-trash"  (click)="deletePost(postE())"></i>
            </div>
        </div>
    </div>
</div>
